<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2c3b31">
  <meta name="description" content="A guided CareRecord presentation: the clinic problem, complete patient workflow, governance, integration, data quality and ETL.">
  <title>CareRecord | Connected care, trusted data</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preload" href="./assets/fonts/inter-0.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/fonts/playfair-4.ttf" as="font" type="font/ttf" crossorigin>
  <script src="./icons.js" defer></script>
  <script src="./slides.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#slide">Skip to presentation</a>
  <div class="presentation-app">
    <header class="toolbar">
      <a class="brand" href="#/welcome" aria-label="CareRecord presentation, first slide"><span data-icon="Activity"></span><span>CareRecord</span></a>
      <span class="toolbar-label">System presentation</span>
      <nav class="tools" aria-label="Presentation tools">
        <button id="fullscreen-toggle" class="tool icon-tool" type="button" aria-label="Enter full screen" title="Slides only (F). Use arrow keys to navigate; Esc to exit."><span data-icon="Maximize"></span></button>
      </nav>
    </header>
    <main id="presentation" aria-label="CareRecord presentation">
      <article id="slide" class="slide" tabindex="-1" aria-labelledby="slide-title"></article>
    </main>
    <footer class="navigation">
      <div class="chapter-location"><span id="chapter-label"></span><span id="slide-label"></span></div>
      <button id="keyboard-help" class="quiet-button" type="button" title="Keyboard shortcuts (?)"><span data-icon="Keyboard"></span><span>Keyboard shortcuts</span></button>
      <nav class="slide-controls" aria-label="Slide navigation">
        <button id="previous" class="nav-button" type="button" aria-label="Previous slide"><span data-icon="ArrowLeft"></span></button>
        <span id="slide-counter" class="slide-counter" aria-label="Current slide"></span>
        <button id="next" class="nav-button primary" type="button" aria-label="Next slide"><span data-icon="ArrowRight"></span></button>
      </nav>
      <progress id="deck-progress" value="1" max="26" aria-label="Presentation progress"></progress>
    </footer>
  </div>
  <dialog id="shortcut-dialog" aria-labelledby="shortcut-heading">
    <div class="panel-top"><h2 id="shortcut-heading">Present at your pace</h2><button class="tool icon-tool" data-close="shortcut-dialog" type="button" aria-label="Close shortcuts"><span data-icon="X"></span></button></div>
    <dl class="shortcut-list"><div><dt>Next slide</dt><dd>→ / Space / Page Down</dd></div><div><dt>Previous slide</dt><dd>← / Page Up</dd></div><div><dt>First / last slide</dt><dd>Home / End</dd></div><div><dt>Full screen</dt><dd>F</dd></div><div><dt>Exit full screen</dt><dd>Esc / F</dd></div></dl>
  </dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><div class="noscript"><h1>CareRecord presentation</h1><p>Enable JavaScript to navigate the slides. The presentation runs locally in your browser and does not connect to clinic records.</p></div></noscript>
</body>
</html>
